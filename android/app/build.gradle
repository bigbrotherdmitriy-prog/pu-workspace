plugins {
    id "com.android.application"
    // Reads app/google-services.json (never committed, see README.md).
    id "com.google.gms.google-services"
}

android {
    namespace "ru.puworkspace.app"
    compileSdk 35

    defaultConfig {
        applicationId "ru.puworkspace.app"
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName "1.1.0"
    }

    signingConfigs {
        release {
            if (System.getenv("PU_ANDROID_KEYSTORE")) {
                storeFile file(System.getenv("PU_ANDROID_KEYSTORE"))
                storePassword System.getenv("PU_ANDROID_STORE_PASSWORD")
                keyAlias System.getenv("PU_ANDROID_KEY_ALIAS")
                keyPassword System.getenv("PU_ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            signingConfig signingConfigs.release
        }
    }
}

dependencies {
    implementation "com.google.androidbrowserhelper:androidbrowserhelper:2.5.0"
    implementation "com.google.firebase:firebase-messaging:24.1.0"
    implementation "androidx.core:core:1.13.1"
}
