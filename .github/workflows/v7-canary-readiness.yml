name: v7 synthetic canary readiness

on:
  workflow_dispatch:
  push:
    branches: ['codex/v7-canary-readiness']

permissions:
  contents: read

jobs:
  canary-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: puw_canary_test
          POSTGRES_USER: puw_canary
          POSTGRES_PASSWORD: canary-${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U puw_canary -d puw_canary_test"
          --health-interval 3s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgresql://puw_canary:canary-${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5432/puw_canary_test
      PU_TEST_POSTGRES: '1'
      CI_CANARY_SYNTHETIC_ONLY: 'true'
      CI_CANARY_SCOPE: run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
      GMAIL_AUTO_SYNC_ENABLED: 'false'
      AI_SECRETARY_AUTOMATION_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install pinned backend dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Upgrade isolated PostgreSQL
        working-directory: backend
        run: alembic -c alembic.ini upgrade head
      - name: Verify exact schema head
        working-directory: backend
        run: test "$(alembic -c alembic.ini heads | awk '{print $1}')" = "a54f001c0a24"
      - name: Execute synthetic daily-work canary
        run: python scripts/ci/v7_canary_readiness.py --output canary-readiness-artifacts/protocol.json
      - name: Publish safe protocol only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v7-canary-readiness-${{ github.run_id }}-${{ github.run_attempt }}
          path: canary-readiness-artifacts/protocol.json
          if-no-files-found: error
          retention-days: 7
