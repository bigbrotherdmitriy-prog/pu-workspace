name: v5.4 synthetic pilot PostgreSQL runtime

on:
  push:
    branches:
      - 'codex/v54-final-integration'
      - 'codex/v54-wave2-integration'
      - 'codex/v54-wave3-integration'
      - 'codex/v54-wave4-integration'
      - 'codex/mvp3-postgres-runtime-gate'
      - 'codex/mvp1234-wave2-integration'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-engines:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install local OCR and synthetic corpus font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-rus tesseract-ocr-eng tesseract-ocr-osd fonts-dejavu-core
          python -m pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Require actual OCR and POSIX symlink acceptance
        run: python scripts/ci/local_engine_acceptance.py
      - name: Publish safe local engine protocol only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-engine-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: local-engine-artifacts/protocol.json
          if-no-files-found: error
          retention-days: 7
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Validate this workflow
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" .github/workflows/v54-pilot-runtime.yml

  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    container: python:3.12-bookworm
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: puw_ci
          POSTGRES_PASSWORD: v54-${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U puw_ci -d postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      POSTGRES_HOST: postgres
      POSTGRES_USER: puw_ci
      POSTGRES_PASSWORD: v54-${{ github.run_id }}-${{ github.run_attempt }}
      GMAIL_AUTO_SYNC_ENABLED: 'false'
      AI_SECRETARY_AUTOMATION_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Generate ephemeral application secrets
        shell: bash
        run: |
          python - <<'PY'
          import base64, os, secrets
          values = {
              "APP_SECRET_KEY": secrets.token_hex(32),
              "BOOTSTRAP_TOKEN": secrets.token_hex(32),
              "TOKEN_ENCRYPTION_KEY": base64.urlsafe_b64encode(os.urandom(32)).decode(),
          }
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf8") as target:
              for key, value in values.items():
                  target.write(f"{key}={value}\n")
          PY
      - name: Install pinned backend dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Run isolated migration, A/B/C, corpus and process faults
        run: python scripts/ci/v54_pilot_workflow.py
      - name: Verify safe protocol contract
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path("v54-runtime-artifacts/protocol.json")
          data = json.loads(path.read_text(encoding="utf8"))
          assert data["schema"] == "puw.v54.runtime.protocol.v1"
          assert data["raw_output_published"] is False
          assert data["cleanup"] == "PASS"
          encoded = json.dumps(data)
          for name in ("POSTGRES_PASSWORD", "APP_SECRET_KEY", "BOOTSTRAP_TOKEN", "TOKEN_ENCRYPTION_KEY"):
              assert os.environ[name] not in encoded
          PY
      - name: Publish safe JSON protocol only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v54-pilot-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: v54-runtime-artifacts/protocol.json
          if-no-files-found: error
          retention-days: 7
