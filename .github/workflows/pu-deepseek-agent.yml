name: PU DeepSeek coding agent (PR only)

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      task:
        description: "Specific coding task; no secrets or credentials"
        required: true
        type: string
      context_files:
        description: "Comma-separated existing source paths to read (max 8)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pu-deepseek-agent
  cancel-in-progress: false

jobs:
  propose:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'deepseek-ready'
    # NEVER use the production self-hosted runner for untrusted code.
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      TASK: ${{ github.event_name == 'issues' && github.event.issue.title || inputs.task }}
      CONTEXT_FILES: ${{ github.event_name == 'issues' && github.event.issue.body || inputs.context_files }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Generate bounded source changes
        run: python3 .github/scripts/deepseek_pr_agent.py
      - name: Create pull request for review
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No changes proposed"; exit 1
          fi
          git config user.name "pu-deepseek-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="agent/deepseek-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch"
          git add -u
          git diff --cached --check
          git commit -m "agent: propose bounded changes"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push "https://github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$branch"
          gh pr create --base main --head "$branch" --draft \
            --title "Agent proposal: ${TASK:0:90}" \
            --body "Generated by DeepSeek from a manually dispatched task. **Review before merge.** No production deployment is performed. Existing CI should run independently. Context files were provided to the external model."
