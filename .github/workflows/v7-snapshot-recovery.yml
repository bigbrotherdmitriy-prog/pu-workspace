name: v7 isolated snapshot recovery
on:
  workflow_dispatch:
  push:
    branches: ['codex/v7-execution-wave4', 'codex/v7-execution-wave5', 'codex/v7-execution-wave6']
permissions:
  contents: read
jobs:
  snapshot-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container: python:3.12-bookworm
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: puw_ci
          POSTGRES_PASSWORD: snapshot-${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_DB: postgres
        options: >-
          --health-cmd 'pg_isready -U puw_ci -d postgres'
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      POSTGRES_HOST: db
      POSTGRES_PASSWORD: snapshot-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Isolated snapshot fault and owned cleanup
        timeout-minutes: 8
        run: python scripts/ci/v7_snapshot_workflow.py
      - name: Publish safe protocol only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: snapshot-recovery-artifacts/protocol.json
          if-no-files-found: error
          retention-days: 7
