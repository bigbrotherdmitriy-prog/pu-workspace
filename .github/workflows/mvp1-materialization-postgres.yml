name: MVP-1 materialization PostgreSQL regression

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  materialization-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: python:3.12-bookworm
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: puw_ci
          POSTGRES_PASSWORD: test-${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U puw_ci -d postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      POSTGRES_HOST: postgres
      POSTGRES_USER: puw_ci
      POSTGRES_PASSWORD: test-${{ github.run_id }}-${{ github.run_attempt }}
      PUW_V54_MATERIALIZATION_DATABASE_URL: postgresql+psycopg://puw_ci:test-${{ github.run_id }}-${{ github.run_attempt }}@postgres/puw_v54_test_materialization
      GMAIL_AUTO_SYNC_ENABLED: 'false'
      AI_SECRETARY_AUTOMATION_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned backend dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Create owned empty test database
        shell: bash
        run: |
          python - <<'PY'
          import os
          import psycopg
          from psycopg import sql

          with psycopg.connect(
              host=os.environ["POSTGRES_HOST"],
              user=os.environ["POSTGRES_USER"],
              password=os.environ["POSTGRES_PASSWORD"],
              dbname="postgres",
              autocommit=True,
          ) as connection:
              connection.execute(sql.SQL("CREATE DATABASE {}")
                  .format(sql.Identifier("puw_v54_test_materialization")))
          PY
      - name: Run exact materialization migration regression
        run: >-
          python -m pytest
          backend/tests/test_v54_materialization_postgres.py::test_postgres_materialization_migration_on_explicit_empty_database
          -q --tb=short -rfsE
      - name: Drop only owned test database
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import os
          import psycopg
          from psycopg import sql

          with psycopg.connect(
              host=os.environ["POSTGRES_HOST"],
              user=os.environ["POSTGRES_USER"],
              password=os.environ["POSTGRES_PASSWORD"],
              dbname="postgres",
              autocommit=True,
          ) as connection:
              connection.execute(
                  "SELECT pg_terminate_backend(pid) FROM pg_stat_activity "
                  "WHERE datname=%s AND pid<>pg_backend_pid()",
                  ("puw_v54_test_materialization",),
              )
              connection.execute(sql.SQL("DROP DATABASE IF EXISTS {} WITH (FORCE)")
                  .format(sql.Identifier("puw_v54_test_materialization")))
          PY
