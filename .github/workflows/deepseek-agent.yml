name: DeepSeek isolated coding agent

on:
  pull_request:
    paths:
      - scripts/ai-agent/**
      - .github/workflows/deepseek-agent.yml
  workflow_dispatch:
    inputs:
      issue_number:
        description: Open issue number (include relevant source paths in backticks)
        required: true
        type: string

permissions: {}
concurrency:
  group: deepseek-agent-${{ github.event_name }}-${{ github.event.pull_request.number || 'manual' }}
  cancel-in-progress: false

jobs:
  policy-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: node --test scripts/ai-agent/agent.test.mjs

  propose:
    needs: policy-tests
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      issues: read
    outputs:
      base: ${{ steps.base.outputs.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - run: node --test scripts/ai-agent/agent.test.mjs
      - name: Request bounded file proposal (no tools or shell access)
        run: node scripts/ai-agent/agent.mjs propose
        env:
          GH_TOKEN: ${{ github.token }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: proposal
          path: ${{ runner.temp }}/proposal.json
          retention-days: 1
          if-no-files-found: error

  validate:
    needs: propose
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ needs.propose.outputs.base }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: proposal
          path: ${{ runner.temp }}/proposal
      - name: Build test dependencies from trusted base before applying changes
        run: |
          docker build -t ai-backend -f scripts/ai-agent/backend.Dockerfile .
          docker build -t ai-frontend -f scripts/ai-agent/frontend.Dockerfile .
      - name: Validate paths and apply proposal as data
        run: node scripts/ai-agent/agent.mjs apply
        env:
          PROPOSAL_FILE: ${{ runner.temp }}/proposal/proposal.json
      - name: Run fixed tests in disposable containers without network or secrets
        # Do not print arbitrary test output (including workflow commands) into Actions logs.
        run: |
          set -euo pipefail
          opts=(--rm --network none --cap-drop ALL --security-opt no-new-privileges --pids-limit 256 --memory 4g --cpus 2 --read-only --tmpfs /tmp:rw,nosuid,size=1g)
          if ! timeout 900 docker run "${opts[@]}" -v "$PWD/backend:/workspace:ro" -w /workspace -e PYTHONDONTWRITEBYTECODE=1 -e PYTHONPATH=/workspace ai-backend python -m pytest -p no:cacheprovider tests -q >/dev/null 2>&1; then
            echo '::error::Offline backend tests failed; proposal will not be published.'; exit 1
          fi
          if ! timeout 300 docker run "${opts[@]}" --tmpfs /app/node_modules/.vite:rw,nosuid,mode=1777 --tmpfs /app/node_modules/.vite-temp:rw,nosuid,mode=1777 -v "$PWD/frontend/src:/app/src:ro" -v "$PWD/frontend/tests:/app/tests:ro" ai-frontend sh -c 'pnpm check && pnpm test' >/dev/null 2>&1; then
            echo '::error::Offline frontend checks failed; proposal will not be published.'; exit 1
          fi

  publish:
    needs: [propose, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ needs.propose.outputs.base }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: proposal
          path: ${{ runner.temp }}/proposal
      - name: Revalidate data and create a fresh branch and draft PR
        run: node scripts/ai-agent/agent.mjs publish
        env:
          GH_TOKEN: ${{ github.token }}
          PROPOSAL_FILE: ${{ runner.temp }}/proposal/proposal.json
