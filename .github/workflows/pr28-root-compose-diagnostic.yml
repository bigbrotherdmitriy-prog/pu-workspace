name: PR28 root Compose startup diagnostic

on:
  push:
    branches: [codex/pr28-root-compose-diagnostic]

permissions:
  contents: read

jobs:
  root-startup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: puw-pr28-${{ github.run_id }}
      COMPOSE_FILE: docker-compose.yml
      GMAIL_AUTO_SYNC_ENABLED: 'false'
      AI_SECRETARY_AUTOMATION_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Generate disposable credentials
        run: |
          python scripts/prepare_test_environment.py
          cp .env.ci .env
          chmod 600 .env
      - name: Validate root Compose
        run: docker compose config --quiet
      - name: Start root Compose from empty PostgreSQL volume
        run: |
          set +e
          timeout 180s docker compose up --build -d --wait --wait-timeout 150 db backend worker scheduler
          rc=$?
          set -e
          echo "ROOT_COMPOSE_EXIT=$rc"
          docker compose ps --all
          docker compose logs --no-color backend worker scheduler 2>&1 | python scripts/redact_ci_logs.py > pr28-root-logs.txt
          tail -n 100 pr28-root-logs.txt
          test "$rc" -eq 0
      - name: Verify migration and scheduler after startup
        run: |
          docker compose exec -T backend alembic current
          docker compose exec -T backend python - <<'PY'
          from sqlalchemy import text
          from app.database import engine
          with engine.connect() as connection:
              assert connection.execute(text("SELECT to_regclass('public.organizer_sessions')")).scalar_one() == 'organizer_sessions'
          print('ORGANIZER_SCHEMA_PRESENT')
          PY
      - name: Remove disposable stack
        if: always()
        run: docker compose down --volumes --remove-orphans --timeout 20
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: pr28-root-compose-${{ github.run_id }}
          path: pr28-root-logs.txt
          if-no-files-found: ignore
          retention-days: 2
