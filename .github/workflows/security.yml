name: Security and release gates
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package-and-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_ci_security.py
      - run: python scripts/check_release_package.py
  python-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pip-audit
      - run: pip-audit -r backend/requirements.txt --format json --output python-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-dependency-audit
          path: python-audit.json
          retention-days: 7
  frontend-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit frontend dependencies with bounded retries
        run: >-
          python scripts/run_frontend_audit.py
          --output frontend-audit.json
          --attempts 3
          --timeout 60
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-dependency-audit
          path: frontend-audit.json
          retention-days: 7
