name: Security and release gates
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package-and-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python scripts/check_ci_security.py
      - run: python scripts/check_release_package.py
  python-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install pip-audit
      - run: pip-audit -r backend/requirements.txt --format json --output python-audit.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: python-dependency-audit
          path: python-audit.json
          retention-days: 7
  frontend-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Scan pnpm lockfile with OSV Scanner
        uses: google/osv-scanner-action/osv-scanner-action@06b2ab4348248b456ee06c9e953637f55e03504f # v2.5.0
        with:
          scan-args: |-
            --format=json
            --output=frontend-audit.json
            --lockfile=./frontend/pnpm-lock.yaml
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: frontend-dependency-audit
          path: frontend-audit.json
          if-no-files-found: error
          retention-days: 7
