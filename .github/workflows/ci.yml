name: PU Workspace CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pu_workspace_test
          POSTGRES_USER: pu_test
          POSTGRES_PASSWORD: pu_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pu_test -d pu_workspace_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://pu_test:pu_test_password@127.0.0.1:5432/pu_workspace_test
      PU_TEST_POSTGRES: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Apply migrations to clean PostgreSQL
        working-directory: backend
        run: alembic -c alembic.ini upgrade head
      - name: Backend and contract tests
        working-directory: backend
        env:
          PYTHONPATH: .
        run: |
          set -o pipefail
          pytest tests -q 2>&1 | tee ../pytest.log
      - name: Upload backend verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-verification-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: pytest.log
          if-no-files-found: warn
          retention-days: 30

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Typecheck frontend
        working-directory: frontend
        run: |
          set -o pipefail
          pnpm run check 2>&1 | tee ../frontend-check.log
      - name: Frontend component tests
        working-directory: frontend
        run: |
          set -o pipefail
          pnpm run test 2>&1 | tee ../frontend-test.log
      - name: Build frontend
        working-directory: frontend
        run: |
          set -o pipefail
          pnpm run build 2>&1 | tee ../frontend-build.log
      - name: Upload frontend verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-verification-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            frontend-check.log
            frontend-test.log
            frontend-build.log
          if-no-files-found: warn
          retention-days: 30

  # Preserve the previous required-check identity for existing branch rules.
  test-and-build:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: always()
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require both complete verification jobs
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          try:
              results = json.loads(os.environ.get("CI_NEEDS_JSON", ""))
          except (ValueError, TypeError):
              results = None
          passed = (
              isinstance(results, dict)
              and set(results) == {"backend", "frontend"}
              and all(
                  isinstance(results[name], dict)
                  and results[name].get("result") == "success"
                  for name in ("backend", "frontend")
              )
          )
          print("CI aggregate PASS" if passed else "CI aggregate FAIL")
          sys.exit(0 if passed else 1)
          PY
