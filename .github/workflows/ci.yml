name: PU Workspace CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pu_workspace_test
          POSTGRES_USER: pu_test
          POSTGRES_PASSWORD: pu_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pu_test -d pu_workspace_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://pu_test:pu_test_password@127.0.0.1:5432/pu_workspace_test
      PU_TEST_POSTGRES: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt PyYAML
      - name: Apply migrations to clean PostgreSQL
        working-directory: backend
        run: alembic -c alembic.ini upgrade head
      - name: Backend and contract tests
        working-directory: backend
        env:
          PYTHONPATH: .
        run: |
          set -o pipefail
          pytest tests -q 2>&1 | tee ../pytest.log
      - name: Contract budget proposal PostgreSQL gates
        working-directory: backend
        env:
          PYTHONPATH: .
        run: |
          set -o pipefail
          pytest -q -rA tests/test_mvp4_contract_budget_proposals_postgres.py \
            --junitxml=../contract-budget-postgres.xml 2>&1 | tee ../contract-budget-postgres.log
          python - <<'PY'
          import xml.etree.ElementTree as ET
          report = ET.parse('../contract-budget-postgres.xml').getroot()
          cases = report.findall('.//testcase')
          assert len(cases) == 2, f'Expected 2 PostgreSQL gates, collected {len(cases)}'
          assert not report.findall('.//skipped'), 'Contract budget PostgreSQL gates must not skip tests'
          PY
      - name: Contract discovery durable PostgreSQL gate
        working-directory: backend
        env:
          PYTHONPATH: .
        run: |
          set -o pipefail
          pytest -q -rA tests/integration/test_contract_discovery_jobs_postgres.py \
            --junitxml=../contract-discovery-postgres.xml 2>&1 | tee ../contract-discovery-postgres.log
          python - <<'PY'
          import xml.etree.ElementTree as ET
          report = ET.parse('../contract-discovery-postgres.xml').getroot()
          cases = report.findall('.//testcase')
          assert len(cases) == 1, f'Expected 1 PostgreSQL gate, collected {len(cases)}'
          assert not report.findall('.//skipped'), 'Contract discovery PostgreSQL gate must not skip'
          PY
      - name: V6-00a money migration PostgreSQL gates
        working-directory: backend
        env:
          PYTHONPATH: .
        run: |
          set -o pipefail
          pytest -q -rA tests/test_v6_00a_money_foundation_postgres.py \
            --junitxml=../v6-00a-money-postgres.xml 2>&1 | tee ../v6-00a-money-postgres.log
          python - <<'PY'
          import xml.etree.ElementTree as ET
          report = ET.parse('../v6-00a-money-postgres.xml').getroot()
          cases = report.findall('.//testcase')
          assert len(cases) == 2, f'Expected 2 V6-00a PostgreSQL gates, collected {len(cases)}'
          assert not report.findall('.//skipped'), 'V6-00a PostgreSQL gates must not skip tests'
          PY
      - name: Provider outbox PostgreSQL recovery races
        working-directory: backend
        env:
          PYTHONPATH: .
          DATABASE_URL: postgresql+psycopg://pu_test:pu_test_password@127.0.0.1:5432/puw_track_e_test
          PUW_TRACK_E_TEST_DSN: postgresql+psycopg://pu_test:pu_test_password@127.0.0.1:5432/puw_track_e_test
        run: |
          set -o pipefail
          python - <<'PY'
          import psycopg
          with psycopg.connect("host=127.0.0.1 dbname=postgres user=pu_test password=pu_test_password", autocommit=True) as db:
              db.execute('CREATE DATABASE puw_track_e_test')
          PY
          python -m alembic -c alembic.ini upgrade head
          python -m pytest -q ../scripts/ci/test_provider_outbox_workflow.py
          python -m pytest -q tests/test_mvp2_provider_outbox_postgres.py -rA --junitxml=../provider-outbox-postgres.xml 2>&1 | tee ../provider-outbox-postgres.log
          python - <<'PY'
          import xml.etree.ElementTree as ET
          report = ET.parse('../provider-outbox-postgres.xml').getroot()
          assert report.findall('.//testcase'), 'PostgreSQL race gate collected no tests'
          assert not report.findall('.//skipped'), 'PostgreSQL race gate must not skip tests'
          PY
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Typecheck frontend
        working-directory: frontend
        run: |
          set -o pipefail
          pnpm run check 2>&1 | tee ../frontend-check.log
      - name: Frontend component tests
        working-directory: frontend
        run: |
          set -o pipefail
          pnpm run test 2>&1 | tee ../frontend-test.log
      - name: Build frontend
        working-directory: frontend
        run: |
          set -o pipefail
          pnpm run build 2>&1 | tee ../frontend-build.log
      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: verification-logs-${{ github.sha }}
          path: |
            pytest.log
            contract-budget-postgres.log
            contract-budget-postgres.xml
            contract-discovery-postgres.log
            contract-discovery-postgres.xml
            v6-00a-money-postgres.log
            v6-00a-money-postgres.xml
            provider-outbox-postgres.log
            provider-outbox-postgres.xml
            frontend-check.log
            frontend-test.log
            frontend-build.log
          if-no-files-found: warn
          retention-days: 30
